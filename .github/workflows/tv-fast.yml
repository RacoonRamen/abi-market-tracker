name: tv-fast
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: crawl
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python abi_tracker.py --minor 40505 --once --csv tv_keys.csv
      - run: python abi_history.py --minor 40505 --out history.json
      - run: python abi_page.py --csv prices_all_full.csv --hist tv_keys.csv --history history.json --json snapshot.json
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv_keys.csv history.json history_state.json dashboard.html snapshot.json
          git diff --cached --quiet || (git commit -m "tv data update" && git push)
