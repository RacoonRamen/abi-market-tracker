name: scrape-tv-keys
# NOTE: 站方阻擋雲端 IP（GitHub/Azure/Oracle 皆回 503），本 workflow 抓不到資料。
# 實際爬蟲在使用者家用 PC 的排程 (run_scrape.ps1, 每 10 分鐘) 執行並 push。
# 這裡保留手動觸發當備援；資料不新鮮會直接失敗，避免用舊資料覆蓋 repo。
on:
  workflow_dispatch:
    inputs:
      minor:
        description: "target minor id (scrape only this, e.g. 40505; empty = full)"
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: cache playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1

      - run: python -m playwright install --with-deps chromium
        if: steps.pwcache.outputs.cache-hit != 'true'

      - run: python -m playwright install chromium
        if: steps.pwcache.outputs.cache-hit == 'true'

      - name: scrape targeted minor
        if: inputs.minor != ''
        run: |
          python abi_tracker.py --minor ${{ inputs.minor }} --once --csv tv_keys.csv
          python abi_history.py --minor ${{ inputs.minor }} --out history.json
          python abi_page.py --csv prices_all_full.csv --hist tv_keys.csv --history history.json --json snapshot.json
          python abi_tv.py
          python forecast.py --out forecast.json

      - name: scrape full
        if: inputs.minor == ''
        run: |
          python abi_tracker.py --minor 40505 --once --csv tv_keys.csv
          python abi_history.py --minor 40505 --out history.json
          python abi_history.py --minor 104,10101,10102,10103,10104,10105,10106,10108,10201,20101,20102,20103,20104,20105,20106,20107,20108,20110,20111,20112,20114,20115,20116,20201,20202,20203,20204,20205,20206,20208,20209,20210,20212,20213,20214,20215,20217,30102,30103,30104,30105,30106,3010101,3010102,3011502,40101,40103,40104,40105,40401,40402,40501,40502,40503,40504,40507,40801,40802,40803,40804,40805,40806,40807,40808,40809,40810,40812,40813,40814 --budget 8 --out history.json
          python abi_page.py --csv prices_all_full.csv --hist tv_keys.csv --history history.json --json snapshot.json
          python abi_tv.py
          python forecast.py --out forecast.json

      - name: verify data is fresh
        run: |
          python - <<'PY'
          import csv, datetime
          rows = list(csv.DictReader(open('tv_keys.csv', encoding='utf-8-sig')))
          ts = max(r['fetched_at_utc'] for r in rows if r['lowest_price'] not in ('', '--'))
          t = datetime.datetime.strptime(ts, '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc)
          age = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() / 60
          print(f'latest price row: {ts} ({age:.0f} min ago)')
          assert age < 120, 'STALE: scrape returned no data (cloud IP likely blocked)'
          PY

      - name: commit data back
        run: |
          git config user.name "abi-scraper"
          git config user.email "abi-scraper@users.noreply.github.com"
          git add tv_keys.csv history.json history_state.json snapshot.json dashboard.html tv_keys.html forecast.json
          if ! git diff --cached --quiet; then
            if [ -n "${{ inputs.minor }}" ]; then
              git commit -m "refresh ${{ inputs.minor }} $(date -u +%FT%TZ)"
            else
              git commit -m "auto scrape $(date -u +%FT%TZ)"
            fi
            for i in 1 2 3 4 5; do
              git fetch -q origin main
              if git rebase -X ours origin/main -q && git push -q origin HEAD:main; then
                echo "pushed (try $i)"; exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 8
            done
            echo "push failed after retries"; exit 1
          else
            echo "no changes"
          fi
