name: build-apk
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Cache debug keystore (stable signing for in-app updates)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          gradle assembleDebug --no-daemon --stacktrace

      - name: Read version
        id: ver
        working-directory: android
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: ABI 價格回報 v${{ steps.ver.outputs.v }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          generate_release_notes: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abi-price-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
